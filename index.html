    <!-- Primary SEO (document title can be long; installed app uses short_name) -->

    <!-- Apply theme before CSS paint so Light mode survives refresh -->
    <script>
      (function () {
        try {
          var key = 'ff_calc_theme';
          var stored = localStorage.getItem(key);
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'light' ? '#f5f6f8' : '#0b0d11');
        } catch (e) {}
      })();
    </script>
