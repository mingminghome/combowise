# Auto-deploy to Cloudflare Pages (Direct Upload) on every push to main.
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN   — API token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — e.g. from `npx wrangler whoami`
#
# Optional build vars (repo Settings → Secrets and variables → Actions → Variables):
#   VITE_BUY_ME_A_PINT_URL           — show “Buy me a pint” chip
#   VITE_GTM_ID                      — enable GTM
#   VITE_GOOGLE_SITE_VERIFICATION    — Search Console meta
#
# Docs: docs/DEPLOY.md

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Public support link — fallback so pint ships even if repo vars are unset
          VITE_BUY_ME_A_PINT_URL: ${{ vars.VITE_BUY_ME_A_PINT_URL || 'https://buymeacoffee.com/mingminghomework' }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploys dist/ + functions/ → https://combowise.pages.dev
          command: pages deploy dist --project-name=combowise --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
