# Auto-deploy to Cloudflare Pages (Direct Upload) on every push to main.
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN   — API token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — e.g. from `npx wrangler whoami`
#
# Docs: docs/DEPLOY.md

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploys dist/ + functions/ → https://combowise.pages.dev
          command: pages deploy dist --project-name=combowise --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
